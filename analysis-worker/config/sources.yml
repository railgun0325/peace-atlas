source_taxonomy:
  official_government: "政府机关、立法院、总统府、部会与公开政府资料"
  official_party: "政党官网、党团公开新闻稿或公开声明"
  news_agency: "通讯社与相对中性新闻线索来源"
  local_media: "台湾本地媒体"
  international_media: "国际媒体、英文媒体与国际新闻聚合发现源"

principles:
  - political_leaning_note 只能作为来源背景备注，不能直接当作事实判断依据。
  - 重大判断必须回到具体标题、链接和多来源证据。
  - 官方说法、媒体报道、政党表态、评论和模型推断必须分开。

sources:
  official_government:
    - name: 总统府
      url: https://www.president.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合确认总统府新闻、谈话、行程与公报；仍需区分官方表态与独立事实。
      political_leaning_note: 现任执政团队官方来源；只作为表态来源背景，不作为事实判断依据。
      enabled: true
    - name: 行政院
      url: https://www.ey.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合确认行政院政策、院会与新闻稿。
      political_leaning_note: 行政机关官方来源；只代表政府说法。
      enabled: true
    - name: 立法院
      url: https://www.ly.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合核对议程、法案、会议与院方新闻。
      political_leaning_note: 国会机构来源；需与党团声明和会议记录分开。
      enabled: true
    - name: 国防部
      url: https://www.mnd.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合确认国防政策、台海周边动态与新闻澄清。
      political_leaning_note: 国防机关官方来源；涉及军事动态时需与其他公开来源交叉验证。
      enabled: true
    - name: 外交部
      url: https://www.mofa.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合确认外交声明、国际互动和正式回应。
      political_leaning_note: 外交机关官方来源；只代表政府外交立场。
      enabled: true
    - name: 陆委会
      url: https://www.mac.gov.tw/
      collection_method: changedetection.io
      reliability_note: 官方公开页面，适合确认两岸政策和政府回应。
      political_leaning_note: 两岸事务主管机关来源；只代表政府政策口径。
      enabled: true

  official_party:
    - name: 民主进步党
      url: https://www.dpp.org.tw/
      collection_method: changedetection.io_or_rsshub
      reliability_note: 政党官方公开页面，适合记录政党公开表态；不能作为独立事实确认。
      political_leaning_note: 民进党官方来源；用于识别民进党公开立场。
      enabled: true
    - name: 中国国民党
      url: https://www.kmt.org.tw/
      collection_method: changedetection.io_or_rsshub
      reliability_note: 政党官方公开页面，适合记录政党公开表态；不能作为独立事实确认。
      political_leaning_note: 国民党官方来源；用于识别国民党公开立场。
      enabled: true
    - name: 台湾民众党
      url: https://www.tpp.org.tw/
      collection_method: changedetection.io_or_rsshub
      reliability_note: 政党官方公开页面，适合记录政党公开表态；不能作为独立事实确认。
      political_leaning_note: 民众党官方来源；用于识别民众党公开立场。
      enabled: true

  news_agency:
    - name: 中央社政治
      url: https://feeds.feedburner.com/rsscna/politics
      collection_method: rss
      reliability_note: 公开 RSS，适合作为台湾政治新闻基线来源；重大事件仍需交叉验证。
      political_leaning_note: 台湾国家通讯社；背景备注不能替代内容证据。
      enabled: true
    - name: 中央社两岸
      url: https://feeds.feedburner.com/rsscna/mainland
      collection_method: rss
      reliability_note: 公开 RSS，适合追踪两岸议题基线报道。
      political_leaning_note: 台湾国家通讯社；背景备注不能替代内容证据。
      enabled: true
    - name: Focus Taiwan CNA English
      url: https://feeds.feedburner.com/rsscna/engnews
      collection_method: rss
      reliability_note: 中央社英文公开 RSS，适合英文受众视角补充。
      political_leaning_note: 台湾国家通讯社英文服务；背景备注不能替代内容证据。
      enabled: true

  local_media:
    - name: 自由时报政治
      url: https://news.ltn.com.tw/rss/politics.xml
      collection_method: rss
      reliability_note: 公开 RSS，适合作为台湾本地政治报道来源；重大判断需与通讯社和官方来源交叉验证。
      political_leaning_note: 外界常视为偏泛绿媒体；只能作为来源背景备注。
      enabled: true
    - name: 自由时报军武
      url: https://news.ltn.com.tw/rss/def.xml
      collection_method: rss
      reliability_note: 公开 RSS，适合作为国防议题本地媒体补充。
      political_leaning_note: 外界常视为偏泛绿媒体；只能作为来源背景备注。
      enabled: true
    - name: 联合新闻网政治
      url: https://udn.com/news/cate/2/6638
      collection_method: changedetection.io_or_rsshub
      reliability_note: 本地媒体公开页面，若使用 RSSHub 需定期确认路由可用。
      political_leaning_note: 外界常视为偏泛蓝或中间偏蓝；只能作为来源背景备注。
      enabled: false
    - name: 中时新闻网政治
      url: https://www.chinatimes.com/politic/
      collection_method: changedetection.io_or_rsshub
      reliability_note: 本地媒体公开页面，若使用 RSSHub 需定期确认路由可用。
      political_leaning_note: 外界常视为偏泛蓝；只能作为来源背景备注。
      enabled: false
    - name: 公视新闻网政治
      url: https://news.pts.org.tw/
      collection_method: changedetection.io_or_rsshub
      reliability_note: 公共媒体公开页面，适合补充相对公共服务媒体视角。
      political_leaning_note: 公共媒体来源；仍需按具体内容判断。
      enabled: false

  international_media:
    - name: Taipei Times
      url: https://www.taipeitimes.com/xml/index.rss
      collection_method: rss
      reliability_note: 英文媒体公开 RSS；新闻和社论必须分开处理。
      political_leaning_note: 英文媒体来源；背景备注不能替代内容证据。
      enabled: true
    - name: Google News - Taiwan politics
      url: https://news.google.com/rss/search?q=Taiwan%20politics&hl=en-US&gl=US&ceid=US:en
      collection_method: rss_search
      reliability_note: 聚合发现源，只用于发现国际报道，重大判断必须回到原始媒体链接。
      political_leaning_note: 聚合源不代表 Google 立场。
      enabled: true
    - name: Google News - 台灣 政治
      url: https://news.google.com/rss/search?q=%E5%8F%B0%E7%81%A3%20%E6%94%BF%E6%B2%BB&hl=zh-TW&gl=TW&ceid=TW:zh-Hant
      collection_method: rss_search
      reliability_note: 聚合发现源，只用于发现中文公开报道，重大判断必须回到原始媒体链接。
      political_leaning_note: 聚合源不代表 Google 立场。
      enabled: true
    - name: GDELT DOC 2.0
      url: https://api.gdeltproject.org/api/v2/doc/doc
      collection_method: api
      reliability_note: 国际公开新闻索引，用于发现外部报道；GDELT 只提供索引元数据，分析必须核对原文链接。
      political_leaning_note: 聚合索引源，不代表 GDELT 立场。
      enabled: true
