name: Build and verify private macOS correction source

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit SHA containing the foundation source manifest
        required: true
        type: string
      release_tag:
        description: Existing private draft release in this repository
        required: true
        type: string

# Write access is used only for the explicitly requested private draft and accepted candidate assets.
permissions:
  contents: write

concurrency:
  group: peace-atlas-native-source-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-native-source:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REPOSITORY: railgun0325/peace-atlas
      # Root-approved public correction source-manifest digest; source commit remains a required input.
      EXPECTED_MANIFEST_SHA256: fb6a0460adf751952a3490f9a814a18e137ddf2749305f36109d073832b277a4
    steps:
      - name: Fetch the exact same-repository source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys, tarfile

          def valid_inputs(repository, expected_repository, source_sha, tag):
              if repository != expected_repository:
                  raise ValueError('Only the explicitly authorized repository is supported')
              if not re.fullmatch(r'[a-f0-9]{40}', source_sha):
                  raise ValueError('source_sha must be a full lowercase commit SHA')
              if source_sha != '44a7b60d3141735af4f4f565e1d4dcdd3bb7c589':
                  raise ValueError('Only the root-approved correction source commit is supported')
              if tag != 'v2.0.0-foundation-correction.20261011':
                  raise ValueError('Only the root-approved correction release tag is supported')
              if not re.fullmatch(r'v[0-9][A-Za-z0-9._-]{0,126}', tag) or '..' in tag:
                  raise ValueError('Invalid release tag')
              return source_sha, tag

          repo = os.environ['GITHUB_REPOSITORY']
          source_sha, tag = valid_inputs(repo, os.environ['EXPECTED_REPOSITORY'],
                                         os.environ['SOURCE_SHA'], os.environ['RELEASE_TAG'])
          if not re.fullmatch(r'[a-f0-9]{64}', os.environ['EXPECTED_MANIFEST_SHA256']):
              raise SystemExit('Correction workflow awaits the new root-approved manifest SHA-256')
          if platform.system() != 'Darwin' or platform.machine() != 'arm64':
              raise SystemExit('Native Apple Silicon runner required')
          if sys.version_info < (3, 12):
              raise SystemExit('Runner Python 3.12 or later is required for safe tar extraction')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          root.mkdir(exist_ok=False)
          evidence = root / 'evidence'
          evidence.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', '--hostname', 'github.com', path], timeout=120))
          repository = api('repos/' + repo)
          if repository.get('private') is not True:
              raise SystemExit('A private repository is required')
          tag_reference = api('repos/' + repo + '/git/ref/tags/' + tag)
          tag_commit = tag_reference.get('object')
          if tag_reference.get('ref') != 'refs/tags/' + tag or not isinstance(tag_commit, dict) or tag_commit.get('type') != 'commit' or tag_commit.get('sha') != source_sha:
              raise SystemExit('The existing fixed release tag must point directly to the exact correction source commit')
          def find_draft_release(repo, tag):
              matches = []
              for page in range(1, 21):
                  rows = api('repos/' + repo + '/releases?per_page=100&page=' + str(page))
                  matches.extend(row for row in rows if row.get('tag_name') == tag)
                  if len(rows) < 100:
                      break
              else:
                  raise SystemExit('Draft lookup exceeded the bounded release list')
              if not matches:
                  if tag != 'v2.0.0-foundation-correction.20261011':
                      raise SystemExit('Only the explicitly requested correction draft may be created')
                  resolved = api('repos/' + repo + '/commits/' + source_sha)
                  if resolved.get('sha') != source_sha:
                      raise SystemExit('Draft source commit did not resolve exactly')
                  body = {'tag_name': tag,
                          'name': 'PEACE ATLAS 2.0.0 - Foundation correction and native acceptance candidate',
                          'body': 'Private correction candidate from source ' + source_sha + '. Source regression, formal report and account/activity recheck acceptance must be recorded before this workflow is bound; native acceptance remains pending. Assets upload only after platform checks pass. This draft is not a completed release. No Apple notarization has been performed.',
                          'draft': True, 'prerelease': True}
                  created = subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'POST',
                                            'repos/' + repo + '/releases', '--input', '-'],
                                           input=json.dumps(body), text=True, capture_output=True, check=False, timeout=120)
                  if created.returncode:
                      try:
                          detail = json.loads(created.stdout)
                      except ValueError:
                          detail = {}
                      print(json.dumps({'release_create_failed': True, 'exit_code': created.returncode,
                                        'message': detail.get('message'), 'status': detail.get('status'),
                                        'documentation_url': detail.get('documentation_url')}))
                      raise SystemExit('GitHub rejected the correction draft creation; no build or upload attempted')
                  matches = [json.loads(created.stdout)]
              if len(matches) != 1 or matches[0].get('draft') is not True:
                  raise SystemExit('Exactly one existing draft with the selected tag is required')
              return matches[0]
          release = find_draft_release(repo, tag)
          if release.get('draft') is not True or release.get('tag_name') != tag:
              raise SystemExit('The selected existing release must remain a draft')
          commit = api('repos/' + repo + '/commits/' + source_sha)
          if commit.get('sha') != source_sha:
              raise SystemExit('GitHub did not resolve the exact requested source commit')
          archive = root / 'source.tar.gz'
          with archive.open('xb') as stream:
              subprocess.run(['gh', 'api', '--hostname', 'github.com',
                              'repos/' + repo + '/tarball/' + source_sha], stdout=stream, check=True, timeout=600)
          with tarfile.open(archive, 'r:gz') as source:
              names = source.getmembers()
              tops = {pathlib.PurePosixPath(item.name).parts[0] for item in names}
              if len(tops) != 1:
                  raise SystemExit('Source archive must have one repository root')
              for item in names:
                  path = pathlib.PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or not (item.isfile() or item.isdir() or item.issym() or item.islnk()):
                      raise SystemExit('Unsafe source archive member')
              source.extractall(root / 'source', filter='data')
          checkout = root / 'source' / tops.pop()
          manifest_path = checkout / 'docs/release-evidence/final-source-manifest-20261011.json'
          manifest_sha = hashlib.file_digest(manifest_path.open('rb'), 'sha256').hexdigest()
          if manifest_sha != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('The committed foundation source manifest differs from the prepared release freeze')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('freeze_format_version') != 2 or not isinstance(manifest['targets'].get('macos-arm64'), int) or manifest['targets']['macos-arm64'] <= 0 or len(manifest['target_files']['macos-arm64']) != manifest['targets']['macos-arm64']:
              raise SystemExit('Unexpected foundation target manifest')
          for name, record in manifest['files'].items():
              relative = pathlib.PurePosixPath(record['source'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit('Manifest source escaped the checkout')
              path = checkout.joinpath(*relative.parts).resolve(strict=True)
              if not path.is_relative_to(checkout.resolve()) or not path.is_file():
                  raise SystemExit('Manifest source is not a checked-out file')
              if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != record['sha256']:
                  raise SystemExit('Committed application source differs: ' + name)
          if hashlib.file_digest((checkout / 'desktop/build.py').open('rb'), 'sha256').hexdigest() != manifest['builder_sha256']:
              raise SystemExit('Committed builder differs from the source freeze')
          receipt = {'repository': repo, 'source_sha': source_sha, 'source_tree_sha': commit['commit']['tree']['sha'],
                     'source_archive_sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest(),
                     'source_manifest_sha256': manifest_sha, 'application_union_count': len(manifest['files']),
                     'mac_application_count': manifest['targets']['macos-arm64'], 'release_tag': tag,
                     'draft_release_id': release['id'], 'platform': platform.platform(), 'architecture': platform.machine()}
          (evidence / 'source-receipt.json').write_text(json.dumps(receipt, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOURCE_DIR=' + str(checkout) + '\n')
          print('Exact source commit and all frozen application sources verified')
          PY

      - name: Build and verify the frozen Mac application target
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, plistlib, stat, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          source = pathlib.Path(os.environ['SOURCE_DIR'])
          evidence = root / 'evidence'
          venv = root / 'build-venv'
          subprocess.run(['python3', '-m', 'venv', str(venv)], check=True, timeout=120)
          python = venv / 'bin/python'
          with (evidence / 'build.log').open('w') as log:
              subprocess.run([str(python), '-I', '-B', str(source / 'desktop/build.py'),
                              '--target', 'macos-arm64', '--mac-signing', 'native-finalizer'],
                             cwd=source, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=3600)
          manifest = json.loads((source / 'docs/release-evidence/final-source-manifest-20261011.json').read_text())
          target = manifest['target_files']['macos-arm64']
          expected = {name: manifest['files'][name]['sha256'] for name in target}
          spec = importlib.util.spec_from_file_location('verified_desktop_builder', source / 'desktop/build.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          actual_sources = builder.application_files('macos-arm64')
          actual = {name: hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() for path, name in actual_sources}
          if len(actual_sources) != len(actual) or actual != expected or len(actual) != manifest['targets']['macos-arm64']:
              raise SystemExit('Mac target membership or application source hashes differ from the committed freeze')
          if builder.ARTIFACT_SUFFIX != '-foundation-quality-20261011' or builder.MAC_MAIN_EXECUTABLE != 'PEACE ATLAS':
              raise SystemExit('The recovery builder suffix and renamed main executable are required')
          results = json.loads((source / 'dist' / ('desktop-build-results' + builder.ARTIFACT_SUFFIX + '.json')).read_text())
          if len(results) != 1 or results[0]['target'] != 'macos-arm64':
              raise SystemExit('Only the requested Mac target may be produced')
          result = results[0]
          archive = pathlib.Path(result['archive']).resolve(strict=True)
          if not archive.is_relative_to((source / 'dist').resolve()):
              raise SystemExit('Build output escaped dist')
          raw_sha = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          if raw_sha != result['sha256']:
              raise SystemExit('Built archive differs from the builder result')
          prefix = 'PEACE ATLAS.app/Contents/Resources/'
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if len(names) != len(set(names)) or bundle.testzip() is not None:
                  raise SystemExit('Built ZIP has duplicate or corrupt entries')
              for name in names:
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe build archive path')
              plist = plistlib.loads(bundle.read('PEACE ATLAS.app/Contents/Info.plist'))
              main = 'PEACE ATLAS.app/Contents/MacOS/' + str(plist.get('CFBundleExecutable', ''))
              if plist.get('CFBundleExecutable') != 'PEACE ATLAS' or main not in names or 'PEACE ATLAS.app/Contents/MacOS/Electron' in names:
                  raise SystemExit('Raw archive main executable and plist do not implement the recovery fix')
              mode = bundle.getinfo(main).external_attr >> 16
              if not stat.S_ISREG(mode) or not mode & stat.S_IXUSR:
                  raise SystemExit('Raw archive main executable lost its regular-file/executable metadata')
              packaged = json.loads(bundle.read(prefix + 'build-manifest.json'))
              packaged_hashes = {row['path']: row['sha256'] for row in packaged['application_files']}
              if len(packaged_hashes) != len(packaged['application_files']) or packaged_hashes != expected:
                  raise SystemExit('Packaged application manifest differs from the committed freeze')
              for name, sha in expected.items():
                  if hashlib.sha256(bundle.read(prefix + name)).hexdigest() != sha:
                      raise SystemExit('Packaged application bytes differ: ' + name)
          (evidence / 'build-result.json').write_text(json.dumps(result, indent=2))
          (evidence / 'raw-archive-sha256.txt').write_text(raw_sha + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RAW_ARCHIVE=' + str(archive) + '\n')
          print('New runner-built ZIP and all ' + str(len(expected)) + ' Mac application files verified before native signing')
          PY

      - name: Finalize and verify native isolated paths
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, plistlib, re, shutil, sqlite3, stat, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          evidence = root / 'evidence'
          stage = root / 'native-app'
          subprocess.run(['ditto', '-x', '-k', os.environ['RAW_ARCHIVE'], str(stage)], check=True, timeout=180)
          app = stage / 'PEACE ATLAS.app'
          resources = app / 'Contents/Resources'
          def main_executable_name(info):
              name = info.get('CFBundleExecutable')
              if name != 'PEACE ATLAS':
                  raise ValueError('The recovery bundle must name PEACE ATLAS as its main executable')
              return name
          main_name = main_executable_name(plistlib.loads((app / 'Contents/Info.plist').read_bytes()))
          executable = app / 'Contents/MacOS' / main_name
          if not executable.is_file() or executable.is_symlink() or not executable.stat().st_mode & stat.S_IXUSR or (app / 'Contents/MacOS/Electron').exists():
              raise SystemExit('Extracted recovery main executable is invalid')
          manifest = json.loads((pathlib.Path(os.environ['SOURCE_DIR']) / 'docs/release-evidence/final-source-manifest-20261011.json').read_text())
          expected = {name: manifest['files'][name]['sha256'] for name in manifest['target_files']['macos-arm64']}
          macho_magic = {b'\xfe\xed\xfa\xce', b'\xce\xfa\xed\xfe', b'\xfe\xed\xfa\xcf', b'\xcf\xfa\xed\xfe',
                         b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca', b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca'}
          signable = set()
          for name, sha in expected.items():
              path = resources / name
              if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != sha:
                  raise SystemExit('Extracted application differs before signing: ' + name)
              with path.open('rb') as stream:
                  if stream.read(4) in macho_magic:
                      signable.add(name)
          def require_secure_storage(receipt, stage):
              checks = receipt.get('checks')
              if not isinstance(checks, dict) or checks.get('secure_storage') is not True:
                  raise SystemExit('Native secure storage smoke must be explicitly true: ' + stage)
              return True
          secure_storage_checks = {}
          def command(name, args, *, env=None, timeout=180):
              with (evidence / (name + '.log')).open('w') as log:
                  subprocess.run(args, check=True, stdout=log, stderr=subprocess.STDOUT, env=env, timeout=timeout)
          # A raw staging package is expected to require finalization. This result is diagnostic only.
          with (evidence / 'raw-signature-diagnostic.log').open('w') as log:
              raw_signature = subprocess.run(['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)],
                                             stdout=log, stderr=subprocess.STDOUT, timeout=180).returncode
          def native_smoke_environment(parent_env, native_tmp, post_open):
              native_home = parent_env.get('HOME')
              if not isinstance(native_home, str) or not native_home or '\x00' in native_home or not pathlib.PurePosixPath(native_home).is_absolute():
                  raise SystemExit('The runner native HOME is required; no synthetic home fallback is allowed')
              env = {name: parent_env[name] for name in ('PATH', 'LANG', 'LC_ALL', 'SHELL') if name in parent_env}
              env.update(HOME=native_home, TMPDIR=str(native_tmp) + '/', PYTHONUTF8='1', PYTHONDONTWRITEBYTECODE='1',
                         WORKBENCH_SMOKE_EXIT='1', WORKBENCH_DATA_DIR=str(post_open))
              return env
          native_tmp = evidence / 'native-tmp'
          post_open = evidence / 'finalizer-post-open-profile'
          for path in (native_tmp, post_open):
              path.mkdir()
          # Preserve the native OS user context; application data stays explicitly isolated.
          env = native_smoke_environment(os.environ, native_tmp, post_open)
          (evidence / 'native-environment.json').write_text(json.dumps({
              'runner_native_home_preserved': env['HOME'] == os.environ['HOME'],
              'explicit_smoke_data_dir_preserved': env['WORKBENCH_DATA_DIR'] == str(post_open),
              'owned_tmpdir_preserved': env['TMPDIR'] == str(native_tmp) + '/',
              'environment_values_saved': False, 'keychain_operations_added': False,
              'plaintext_fallback_added': False}, indent=2))
          print('Native smoke environment: runner HOME preserved; application data and temp remain isolated', flush=True)
          # The finalizer's concluding `open` also inherits this explicit smoke profile.
          command('native-finalizer', ['bash', str(stage / 'Finalize PEACE ATLAS.command'), '--smoke'], env=env, timeout=1200)
          audits = list(native_tmp.glob('peace-atlas-sign.*'))
          if len(audits) != 1:
              raise SystemExit('Native finalizer audit directory is ambiguous')
          shutil.copy2(audits[0] / 'codesign.log', evidence / 'finalizer-codesign.log')
          for name in ('desktop-smoke.json', 'desktop-smoke.png', 'browser-smoke.json'):
              shutil.copy2(audits[0] / 'smoke' / name, evidence / ('finalizer-' + name))
          finalizer_desktop = json.loads((evidence / 'finalizer-desktop-smoke.json').read_text())
          finalizer_browser = json.loads((evidence / 'finalizer-browser-smoke.json').read_text())
          if finalizer_desktop.get('health', {}).get('ok') is not True or finalizer_browser.get('ok') is not True:
              raise SystemExit('Finalizer desktop/backend/browser smoke failed')
          secure_storage_checks['finalizer_desktop'] = require_secure_storage(finalizer_desktop, 'finalizer_desktop')
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              commands = subprocess.check_output(['ps', '-ax', '-o', 'command='], text=True)
              active = any(line.strip() == str(executable) or line.strip().startswith(str(executable) + ' ') for line in commands.splitlines())
              if (post_open / 'desktop-smoke.json').exists() and not active:
                  break
              time.sleep(1)
          else:
              raise SystemExit('Finalizer concluding native open did not finish in its isolated smoke profile')
          post_open_desktop = json.loads((post_open / 'desktop-smoke.json').read_text())
          if post_open_desktop.get('health', {}).get('ok') is not True:
              raise SystemExit('Finalizer concluding isolated open failed')
          secure_storage_checks['finalizer_post_open_desktop'] = require_secure_storage(post_open_desktop, 'finalizer_post_open_desktop')
          command('codesign-after-finalization', ['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)])
          def require_optional_ui_smokes(desktop, profile):
              checks = desktop.get('checks')
              if not isinstance(checks, dict) or any(name in checks for name in ('sessions', 'collection', 'report', 'research', 'connection_recovery')):
                  raise SystemExit('Independent UI acceptance must not request paid, network or account operations')
              budgets = checks.get('budgets')
              if not isinstance(budgets, dict) or budgets.get('boundary_preview_ready') is not True or type(budgets.get('preview_created_jobs')) is not int or budgets['preview_created_jobs'] != 0:
                  raise SystemExit('Independent read-only budget preview must complete without creating jobs')
              typography = checks.get('typography')
              if not isinstance(typography, dict):
                  raise SystemExit('Independent bundled typography acceptance is missing')
              for surface in ('overview', 'workspace'):
                  details = typography.get(surface)
                  if not isinstance(details, dict) or details.get('horizontal_overflow') is not False:
                      raise SystemExit('Independent bundled typography must fit each native surface')
                  fonts = details.get('fonts')
                  if not isinstance(fonts, list) or not all(any(isinstance(font, dict) and font.get('status') == 'loaded' and isinstance(font.get('family'), str) and family in font['family'] for font in fonts) for family in ('Atlas Mincho', 'Atlas Signal')):
                      raise SystemExit('Independent native typography requires both bundled fonts loaded')
              composer = typography.get('composer')
              if not isinstance(composer, dict) or composer.get('dialog_overflow') is not False:
                  raise SystemExit('Independent native typography composer must fit')
              images = []
              for name in ('desktop-eva-overview.png', 'desktop-eva-workspace.png', 'desktop-eva-composer.png', 'desktop-budget-controls.png', 'desktop-budget-preview.png'):
                  data = (profile / name).read_bytes()
                  if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                      raise SystemExit('Independent typography/budget screenshot is not a PNG')
                  width, height = int.from_bytes(data[16:20], 'big'), int.from_bytes(data[20:24], 'big')
                  if width < 640 or height < 400:
                      raise SystemExit('Independent typography/budget screenshot dimensions are invalid')
                  images.append({'name': name, 'width': width, 'height': height, 'sha256': hashlib.sha256(data).hexdigest()})
              return {'typography': True, 'read_only_budgets': True, 'screenshots': images}
          profile = evidence / 'isolated-profile'
          profile.mkdir()
          # Use the same existing router-driven typography/budget/backup order accepted on Windows.
          launch_env = dict(env, WORKBENCH_DATA_DIR=str(profile), WORKBENCH_SMOKE_BACKUP='1',
                            WORKBENCH_SMOKE_TYPOGRAPHY='1', WORKBENCH_SMOKE_BUDGETS='1')
          command('native-launch', [str(executable)], env=launch_env, timeout=300)
          desktop = json.loads((profile / 'desktop-smoke.json').read_text())
          if desktop.get('health', {}).get('ok') is not True or not (profile / 'desktop-smoke.png').stat().st_size:
              raise SystemExit('Independent native desktop/backend smoke failed')
          secure_storage_checks['independent_desktop'] = require_secure_storage(desktop, 'independent_desktop')
          native_ui_evidence = require_optional_ui_smokes(desktop, profile)
          backup = desktop.get('checks', {}).get('backup', {})
          backup_path = pathlib.Path(backup['file']).resolve(strict=True)
          if not backup_path.is_relative_to(profile.resolve()) or backup.get('source_draft_unchanged') is not True:
              raise SystemExit('Backup smoke did not remain isolated')
          with sqlite3.connect(backup_path.as_uri() + '?mode=ro', uri=True) as database:
              if database.execute('PRAGMA quick_check').fetchone()[0] != 'ok':
                  raise SystemExit('Native downloaded backup failed SQLite integrity')
              columns = {row[1] for row in database.execute('PRAGMA table_info(wb_drafts)')}
              if not columns or not any(backup['draft_keyword'] in str(row) for row in database.execute('SELECT * FROM wb_drafts')):
                  raise SystemExit('Native downloaded backup omitted the committed synthetic draft')
          command('bundled-browser', [str(resources / 'python/bin/python3'), '-I', '-B',
                  str(resources / 'backend/browser_smoke.py'), '--browsers-path', str(resources / 'browsers'),
                  '--output', str(evidence / 'browser-smoke.json')], env=env, timeout=180)
          browser = json.loads((evidence / 'browser-smoke.json').read_text())
          if browser.get('ok') is not True or {row['mode'] for row in browser['checks']} != {'headless', 'visible'}:
              raise SystemExit('Bundled browser acceptance requires both offline modes')
          changed = []
          for name, sha in expected.items():
              actual = hashlib.file_digest((resources / name).open('rb'), 'sha256').hexdigest()
              if actual != sha:
                  if name not in signable:
                      raise SystemExit('Native finalization changed frozen non-Mach-O application bytes: ' + name)
                  changed.append(name)
          command('codesign-after-all-smokes', ['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)])
          finalized = list(stage.glob('*-adhoc.zip'))
          if len(finalized) != 1:
              raise SystemExit('Native finalized archive is ambiguous')
          roundtrip = root / 'signed-archive-roundtrip'
          subprocess.run(['ditto', '-x', '-k', str(finalized[0]), str(roundtrip)], check=True, timeout=180)
          command('codesign-finalized-zip-roundtrip', ['codesign', '--verify', '--deep', '--strict', '--verbose=2',
                  str(roundtrip / 'PEACE ATLAS.app')])
          def app_inventory(base):
              return {path.relative_to(base).as_posix(): ('link', os.readlink(path)) if path.is_symlink() else
                      ('file', hashlib.file_digest(path.open('rb'), 'sha256').hexdigest())
                      for path in base.rglob('*') if path.is_symlink() or path.is_file()}
          if app_inventory(app) != app_inventory(roundtrip / 'PEACE ATLAS.app'):
              raise SystemExit('Finalized ZIP bytes differ from the natively tested signed application')
          native_sha = hashlib.file_digest(finalized[0].open('rb'), 'sha256').hexdigest()
          raw_sha = (evidence / 'raw-archive-sha256.txt').read_text().strip()
          prior_cross_built_sha = '20e40a1a55321448dba1ff816706cb3da21473ade7070a6b12181dd4a6b550d5'
          if native_sha in (raw_sha, prior_cross_built_sha):
              raise SystemExit('Native derived archive must not be represented as either raw ZIP')
          assets = root / 'release-assets'
          assets.mkdir()
          name = ('PEACE-ATLAS-2.0.0-macos-arm64-foundation-quality-20261011-native-' + os.environ['SOURCE_SHA'][:12]
                  + '-run' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.zip')
          output = assets / name
          shutil.copy2(finalized[0], output)
          (assets / (name + '.sha256')).write_text(native_sha + '  ' + name + '\n')
          source_receipt = json.loads((evidence / 'source-receipt.json').read_text())
          acceptance = {**source_receipt, 'ok': True, 'native_finalized_archive': name, 'native_finalized_archive_sha256': native_sha,
                        'runner_built_raw_archive_sha256': raw_sha, 'prior_windows_cross_built_sha256_reference': prior_cross_built_sha,
                        'same_archive_as_prior_cross_build': False, 'raw_signature_verified': raw_signature == 0,
                        'macos_main_executable': main_name,
                        'native_codesign': True, 'finalizer_smoke': True, 'finalizer_post_open_isolated': True,
                        'secure_storage': True, 'secure_storage_checks': secure_storage_checks,
                        'finalized_zip_roundtrip_codesign_and_bytes': True,
                        'native_desktop_backend': True, 'native_backup_sqlite_integrity': True, 'bundled_browser': browser,
                        'native_typography': native_ui_evidence['typography'], 'native_read_only_budgets': native_ui_evidence['read_only_budgets'],
                        'native_ui_screenshots': native_ui_evidence['screenshots'],
                        'application_macho_hashes_changed_by_signing': changed,
                        'frozen_non_macho_application_unchanged': True, 'real_model_calls': 0, 'formal_user_data_accessed': False,
                        'notarization': 'not performed', 'quarantine_or_gatekeeper_changes': False,
                        'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          (evidence / 'acceptance.json').write_text(json.dumps(acceptance, indent=2))
          (assets / (name + '.acceptance.json')).write_text(json.dumps(acceptance, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Native ARM64 source build and acceptance passed for commit `' + os.environ['SOURCE_SHA'] + '`.\n\n')
              summary.write('Derived ad-hoc ZIP SHA-256: `' + native_sha + '`. This is a newly built and natively finalized archive, not the Windows cross-built ZIP. No notarization, real-model call or formal user data was used.\n')
          PY

      - name: Upload accepted native candidate to the existing private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          if repo != os.environ['EXPECTED_REPOSITORY'] or not re.fullmatch(r'[a-f0-9]{40}', os.environ['SOURCE_SHA']):
              raise SystemExit('Repository or source input changed')
          if not re.fullmatch(r'v[0-9][A-Za-z0-9._-]{0,126}', tag) or '..' in tag:
              raise SystemExit('Invalid release tag')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', '--hostname', 'github.com', path], timeout=120))
          accepted = json.loads((root / 'evidence/acceptance.json').read_text())
          if accepted.get('ok') is not True or accepted['source_sha'] != os.environ['SOURCE_SHA'] or accepted['release_tag'] != tag:
              raise SystemExit('Complete acceptance is required before upload')
          secure_checks = accepted.get('secure_storage_checks')
          required_secure_stages = {'finalizer_desktop', 'finalizer_post_open_desktop', 'independent_desktop'}
          if accepted.get('secure_storage') is not True or not isinstance(secure_checks, dict) or set(secure_checks) != required_secure_stages or any(value is not True for value in secure_checks.values()):
              raise SystemExit('All three explicit secure storage acceptance checks are required before upload')
          if accepted.get('native_typography') is not True or accepted.get('native_read_only_budgets') is not True:
              raise SystemExit('Independent native typography and read-only budget acceptance are required before upload')
          release = api('repos/' + repo + '/releases/' + str(accepted['draft_release_id']))
          if api('repos/' + repo).get('private') is not True or release.get('draft') is not True or release['id'] != accepted['draft_release_id'] or release.get('tag_name') != tag:
              raise SystemExit('The same private draft must still exist')
          tag_reference = api('repos/' + repo + '/git/ref/tags/' + tag)
          tag_commit = tag_reference.get('object')
          if tag_reference.get('ref') != 'refs/tags/' + tag or not isinstance(tag_commit, dict) or tag_commit.get('type') != 'commit' or tag_commit.get('sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('The existing fixed release tag must point directly to the exact correction source commit')
          assets = sorted((root / 'release-assets').iterdir())
          if len(assets) != 3 or {path.name for path in assets} != {accepted['native_finalized_archive'],
                  accepted['native_finalized_archive'] + '.sha256', accepted['native_finalized_archive'] + '.acceptance.json'}:
              raise SystemExit('Unexpected upload asset set')
          archive = root / 'release-assets' / accepted['native_finalized_archive']
          if hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() != accepted['native_finalized_archive_sha256']:
              raise SystemExit('Accepted native archive changed before upload')
          # No --clobber: a retry cannot replace a prior candidate or the Windows-built archive.
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, assets), '--repo', repo], check=True, timeout=900)
          after = api('repos/' + repo + '/releases/' + str(accepted['draft_release_id']))
          uploaded = {asset['name']: asset for asset in after['assets']}
          for path in assets:
              asset = uploaded.get(path.name)
              digest = 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              if not asset or asset.get('size') != path.stat().st_size or asset.get('state') != 'uploaded':
                  raise SystemExit('Uploaded release asset is incomplete')
              if asset.get('digest') != digest:
                  raise SystemExit('GitHub asset digest differs from the accepted file')
          if after.get('draft') is not True or after['id'] != accepted['draft_release_id'] or after.get('tag_name') != tag:
              raise SystemExit('Release draft changed during upload')
          (root / 'evidence/upload-receipt.json').write_text(json.dumps({'ok': True, 'repository': repo,
              'release_tag': tag, 'release_id': after['id'], 'draft': True, 'asset_names': [path.name for path in assets],
              'native_finalized_archive_sha256': accepted['native_finalized_archive_sha256']}, indent=2))
          print('Accepted native candidate assets uploaded to the same private draft')
          PY

      - name: Preserve native acceptance evidence even on failure
        if: always()
