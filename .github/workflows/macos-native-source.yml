              receipt = {'version': 1, 'original_deadline_seconds': timeout, 'sample_duration_seconds': 5,
                         'sample_interval_milliseconds': 10, 'sampling_attempts': 0, 'sampling_status': 'waiting_ready',
                         'runtime_sampling_permission': 'not_verified', 'argv_or_environment_saved': False,
                         'timeline': [], 'application_result': 'running',
                         'pid_attachment_limit': 'PID-based sample has a narrow non-atomic reuse race; changed identities discard the report'}
              seen = set()
              def event(name, **values):
                  receipt['timeline'].append(dict(event=name, utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                                  elapsed_seconds=round(time.monotonic() - started, 3), **values))
                  try:
                      (evidence / 'native-finalizer-diagnostics.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
                  except OSError:
                      receipt['diagnostic_receipt_write_errors'] = receipt.get('diagnostic_receipt_write_errors', 0) + 1
              event('monitor_started')
              reader, sampler, private_dir, main_identity = None, None, None, None
              sampler_cleanup_deadline = None
              def cleanup_private_report():
                  nonlocal private_dir
                  if private_dir is not None:
                      try:
                          private_dir.cleanup()
                      except OSError:
                          # Remnant is inside an owned private directory excluded by all artifact globs.
                          receipt['private_report_cleanup_errors'] = receipt.get('private_report_cleanup_errors', 0) + 1
                          event('private_report_cleanup_unavailable')
                      private_dir = None
              candidate, fatal_guard = None, False
              try:
                  reader = MacProcesses(deadline)
              except DiagnosticGuardError as error:
                  receipt['sampling_status'] = str(error)
                  fatal_guard = True
                  event('sampling_capability_unavailable', reason=str(error))
              with (evidence / 'native-finalizer.log').open('w') as log:
                  finalizer = subprocess.Popen(args, stdout=log, stderr=subprocess.STDOUT, env=env, start_new_session=True)
                  event('finalizer_started', pid=finalizer.pid)
