                      while finalizer.poll() is None:
                          if time.monotonic() >= deadline:
                              receipt['application_result'] = 'timeout'
                              event('original_finalizer_deadline_reached')
                              # Same immediate-child termination boundary as subprocess.run(timeout=1200).
                              finalizer.kill()
                              finalizer.wait()
                              raise subprocess.TimeoutExpired(args, timeout)
                          for phrase, stage_name in (
                              ('Signing PEACE ATLAS locally.', 'local_signing_started'),
                              ('Ad-hoc integrity signature verified.', 'adhoc_signature_verified_before_smoke')):
                              if stage_name not in seen:
                                  output_path = evidence / 'native-finalizer.log'
                                  try:
                                      log.flush()
                                      if output_path.stat().st_size <= 1024 * 1024 and phrase in output_path.read_text(encoding='utf-8', errors='replace'):
                                          seen.add(stage_name)
                                          event(stage_name)
                                  except OSError:
                                      seen.add(stage_name)
                                      event('finalizer_output_observation_unavailable', stage=stage_name)
                          if not fatal_guard and candidate is None:
                              try:
                                  candidate = ready_candidate(native_tmp, launch_ns)
                                  if candidate:
                                      event('foreground_ready_and_application_ready', main_pid=candidate['pid'])
                              except (DiagnosticGuardError, OSError) as error:
                                  receipt['sampling_status'] = str(error) if isinstance(error, DiagnosticGuardError) else 'ready_observation_unavailable'
                                  fatal_guard = True
                                  event('sampling_guard_rejected', reason=receipt['sampling_status'])
                          if candidate:
                              for name in ('desktop-smoke.json', 'desktop-smoke-error.json', 'desktop-smoke.png', 'browser-smoke.json'):
                                  if name not in seen:
