name: Build and verify private macOS recovery source

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit SHA containing the foundation source manifest
        required: true
        type: string
      release_tag:
        description: Existing private draft release in this repository
        required: true
        type: string

# Write access is used only by the final candidate release-asset upload step.
permissions:
  contents: write

concurrency:
  group: peace-atlas-native-source-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-native-source:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_REPOSITORY: railgun0325/peace-atlas
      # Root must replace this placeholder with the new committed source-freeze digest.
      EXPECTED_MANIFEST_SHA256: b4ad7ce3a924307f485e9730a7e8d1b13caf26540c97ed9ddf786d189b245adc
    steps:
      - name: Fetch the exact same-repository source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, re, subprocess, sys, tarfile

          def valid_inputs(repository, expected_repository, source_sha, tag):
              if repository != expected_repository:
                  raise ValueError('Only the explicitly authorized repository is supported')
              if not re.fullmatch(r'[a-f0-9]{40}', source_sha):
                  raise ValueError('source_sha must be a full lowercase commit SHA')
              if not re.fullmatch(r'v[0-9][A-Za-z0-9._-]{0,126}', tag) or '..' in tag:
                  raise ValueError('Invalid release tag')
              return source_sha, tag

          repo = os.environ['GITHUB_REPOSITORY']
          source_sha, tag = valid_inputs(repo, os.environ['EXPECTED_REPOSITORY'],
                                         os.environ['SOURCE_SHA'], os.environ['RELEASE_TAG'])
          if not re.fullmatch(r'[a-f0-9]{64}', os.environ['EXPECTED_MANIFEST_SHA256']):
              raise SystemExit('Recovery workflow awaits the new root-approved manifest SHA-256')
          if platform.system() != 'Darwin' or platform.machine() != 'arm64':
              raise SystemExit('Native Apple Silicon runner required')
          if sys.version_info < (3, 12):
              raise SystemExit('Runner Python 3.12 or later is required for safe tar extraction')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          root.mkdir(exist_ok=False)
          evidence = root / 'evidence'
          evidence.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', '--hostname', 'github.com', path], timeout=120))
          repository = api('repos/' + repo)
          if repository.get('private') is not True:
              raise SystemExit('A private repository is required')
          def find_draft_release(repo, tag):
              matches = []
              for page in range(1, 21):
                  rows = api('repos/' + repo + '/releases?per_page=100&page=' + str(page))
                  matches.extend(row for row in rows if row.get('tag_name') == tag)
                  if len(rows) < 100:
                      break
              else:
                  raise SystemExit('Draft lookup exceeded the bounded release list')
              if not matches:
                  if tag != 'v2.0.0-foundation-recovery.20261011':
                      raise SystemExit('Only the explicitly requested recovery draft may be created')
                  resolved = api('repos/' + repo + '/commits/' + source_sha)
                  if resolved.get('sha') != source_sha:
                      raise SystemExit('Draft source commit did not resolve exactly')
                  body = {'tag_name': tag, 'target_commitish': source_sha,
                          'name': 'PEACE ATLAS 2.0.0 - Report recovery and native startup fixes',
                          'body': 'Private recovery candidate from source ' + source_sha + '. Full regression and native platform acceptance are in progress. Assets upload only after platform checks pass. This draft is not a completed release. No Apple notarization has been performed.',
                          'draft': True, 'prerelease': True}
                  created = subprocess.run(['gh', 'api', '--hostname', 'github.com', '--method', 'POST',
                                            'repos/' + repo + '/releases', '--input', '-'],
                                           input=json.dumps(body), text=True, capture_output=True, check=False, timeout=120)
                  if created.returncode:
                      try:
                          detail = json.loads(created.stdout)
                      except ValueError:
                          detail = {}
                      print(json.dumps({'release_create_failed': True, 'exit_code': created.returncode,
                                        'message': detail.get('message'), 'status': detail.get('status'),
                                        'documentation_url': detail.get('documentation_url')}))
                      raise SystemExit('GitHub rejected the recovery draft creation; no build or upload attempted')
                  matches = [json.loads(created.stdout)]
              if len(matches) != 1 or matches[0].get('draft') is not True:
                  raise SystemExit('Exactly one existing draft with the selected tag is required')
              return matches[0]
          release = find_draft_release(repo, tag)
          if release.get('draft') is not True or release.get('tag_name') != tag:
              raise SystemExit('The selected existing release must remain a draft')
          commit = api('repos/' + repo + '/commits/' + source_sha)
          if commit.get('sha') != source_sha:
              raise SystemExit('GitHub did not resolve the exact requested source commit')
          archive = root / 'source.tar.gz'
          with archive.open('xb') as stream:
              subprocess.run(['gh', 'api', '--hostname', 'github.com',
                              'repos/' + repo + '/tarball/' + source_sha], stdout=stream, check=True, timeout=600)
          with tarfile.open(archive, 'r:gz') as source:
              names = source.getmembers()
              tops = {pathlib.PurePosixPath(item.name).parts[0] for item in names}
              if len(tops) != 1:
                  raise SystemExit('Source archive must have one repository root')
              for item in names:
                  path = pathlib.PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or not (item.isfile() or item.isdir() or item.issym() or item.islnk()):
                      raise SystemExit('Unsafe source archive member')
              source.extractall(root / 'source', filter='data')
          checkout = root / 'source' / tops.pop()
          manifest_path = checkout / 'docs/release-evidence/recovery-source-manifest-20261011.json'
          manifest_sha = hashlib.file_digest(manifest_path.open('rb'), 'sha256').hexdigest()
          if manifest_sha != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('The committed foundation source manifest differs from the prepared release freeze')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('freeze_format_version') != 2 or not isinstance(manifest['targets'].get('macos-arm64'), int) or manifest['targets']['macos-arm64'] <= 0 or len(manifest['target_files']['macos-arm64']) != manifest['targets']['macos-arm64']:
              raise SystemExit('Unexpected foundation target manifest')
          for name, record in manifest['files'].items():
              relative = pathlib.PurePosixPath(record['source'])
              if relative.is_absolute() or '..' in relative.parts:
                  raise SystemExit('Manifest source escaped the checkout')
              path = checkout.joinpath(*relative.parts).resolve(strict=True)
              if not path.is_relative_to(checkout.resolve()) or not path.is_file():
                  raise SystemExit('Manifest source is not a checked-out file')
              if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != record['sha256']:
                  raise SystemExit('Committed application source differs: ' + name)
          if hashlib.file_digest((checkout / 'desktop/build.py').open('rb'), 'sha256').hexdigest() != manifest['builder_sha256']:
              raise SystemExit('Committed builder differs from the source freeze')
          receipt = {'repository': repo, 'source_sha': source_sha, 'source_tree_sha': commit['commit']['tree']['sha'],
                     'source_archive_sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest(),
                     'source_manifest_sha256': manifest_sha, 'application_union_count': len(manifest['files']),
                     'mac_application_count': manifest['targets']['macos-arm64'], 'release_tag': tag,
                     'draft_release_id': release['id'], 'platform': platform.platform(), 'architecture': platform.machine()}
          (evidence / 'source-receipt.json').write_text(json.dumps(receipt, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOURCE_DIR=' + str(checkout) + '\n')
          print('Exact source commit and all frozen application sources verified')
          PY

      - name: Build and verify the frozen Mac application target
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, plistlib, stat, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'peace-atlas-native-source'
          source = pathlib.Path(os.environ['SOURCE_DIR'])
          evidence = root / 'evidence'
          venv = root / 'build-venv'
          subprocess.run(['python3', '-m', 'venv', str(venv)], check=True, timeout=120)
          python = venv / 'bin/python'
          with (evidence / 'build.log').open('w') as log:
              subprocess.run([str(python), '-I', '-B', str(source / 'desktop/build.py'),
                              '--target', 'macos-arm64', '--mac-signing', 'native-finalizer'],
                             cwd=source, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=3600)
          manifest = json.loads((source / 'docs/release-evidence/recovery-source-manifest-20261011.json').read_text())
          target = manifest['target_files']['macos-arm64']
          expected = {name: manifest['files'][name]['sha256'] for name in target}
          spec = importlib.util.spec_from_file_location('verified_desktop_builder', source / 'desktop/build.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          actual_sources = builder.application_files('macos-arm64')
          actual = {name: hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() for path, name in actual_sources}
          if len(actual_sources) != len(actual) or actual != expected or len(actual) != manifest['targets']['macos-arm64']:
              raise SystemExit('Mac target membership or application source hashes differ from the committed freeze')
          if builder.ARTIFACT_SUFFIX != '-foundation-recovery-20261011' or builder.MAC_MAIN_EXECUTABLE != 'PEACE ATLAS':
              raise SystemExit('The recovery builder suffix and renamed main executable are required')
          results = json.loads((source / 'dist' / ('desktop-build-results' + builder.ARTIFACT_SUFFIX + '.json')).read_text())
          if len(results) != 1 or results[0]['target'] != 'macos-arm64':
              raise SystemExit('Only the requested Mac target may be produced')
          result = results[0]
          archive = pathlib.Path(result['archive']).resolve(strict=True)
          if not archive.is_relative_to((source / 'dist').resolve()):
              raise SystemExit('Build output escaped dist')
          raw_sha = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          if raw_sha != result['sha256']:
              raise SystemExit('Built archive differs from the builder result')
          prefix = 'PEACE ATLAS.app/Contents/Resources/'
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              if len(names) != len(set(names)) or bundle.testzip() is not None:
                  raise SystemExit('Built ZIP has duplicate or corrupt entries')
              for name in names:
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe build archive path')
              plist = plistlib.loads(bundle.read('PEACE ATLAS.app/Contents/Info.plist'))
              main = 'PEACE ATLAS.app/Contents/MacOS/' + str(plist.get('CFBundleExecutable', ''))
              if plist.get('CFBundleExecutable') != 'PEACE ATLAS' or main not in names or 'PEACE ATLAS.app/Contents/MacOS/Electron' in names:
                  raise SystemExit('Raw archive main executable and plist do not implement the recovery fix')
              mode = bundle.getinfo(main).external_attr >> 16
              if not stat.S_ISREG(mode) or not mode & stat.S_IXUSR:
                  raise SystemExit('Raw archive main executable lost its regular-file/executable metadata')
              packaged = json.loads(bundle.read(prefix + 'build-manifest.json'))
              packaged_hashes = {row['path']: row['sha256'] for row in packaged['application_files']}
              if len(packaged_hashes) != len(packaged['application_files']) or packaged_hashes != expected:
                  raise SystemExit('Packaged application manifest differs from the committed freeze')
              for name, sha in expected.items():
                  if hashlib.sha256(bundle.read(prefix + name)).hexdigest() != sha:
                      raise SystemExit('Packaged application bytes differ: ' + name)
          (evidence / 'build-result.json').write_text(json.dumps(result, indent=2))
          (evidence / 'raw-archive-sha256.txt').write_text(raw_sha + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RAW_ARCHIVE=' + str(archive) + '\n')
          print('New runner-built ZIP and all ' + str(len(expected)) + ' Mac application files verified before native signing')
          PY

      - name: Finalize and verify native isolated paths
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, plistlib, re, shutil, sqlite3, stat, subprocess, time
          """CI-only diagnostic monitor. Never changes application or OS security settings."""
          import ctypes
          import datetime
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import stat
          import subprocess
          import tempfile
          import time


          class DiagnosticGuardError(Exception):
              """An ownership/capability check failed; diagnostic sampling must not run."""


          def owned_path(path, root, *, directory=False, fresh_ns=None):
              path, root = Path(path), Path(root)
              try:
                  if path.is_symlink() or root.is_symlink():
                      raise DiagnosticGuardError('symlink')
                  resolved_root = root.resolve(strict=True)
                  resolved = path.resolve(strict=True)
                  resolved.relative_to(resolved_root)
                  current = path
                  while current != root:
                      if current.is_symlink():
                          raise DiagnosticGuardError('symlink_ancestor')
                      if current.parent == current:
                          raise DiagnosticGuardError('outside_owned_root')
                      current = current.parent
                  info = path.stat()
                  expected = stat.S_ISDIR if directory else stat.S_ISREG
                  if not expected(info.st_mode):
                      raise DiagnosticGuardError('nonregular_owned_path')
                  if hasattr(os, 'getuid') and info.st_uid != os.getuid():
                      raise DiagnosticGuardError('wrong_file_uid')
                  if fresh_ns is not None and info.st_mtime_ns < fresh_ns:
                      raise DiagnosticGuardError('stale_owned_file')
                  return resolved
              except (OSError, ValueError) as error:
                  raise DiagnosticGuardError('unavailable_owned_path') from error


          def ready_candidate(native_tmp, launch_ns):
              """Only the foreground finalizer smoke profile, never concluding-open profiles."""
              root = Path(native_tmp)
              audits = list(root.glob('peace-atlas-sign.*'))
              if not audits:
                  return None
              if len(audits) != 1:
                  raise DiagnosticGuardError('ambiguous_audit')
              audit = audits[0]
              owned_path(audit, root, directory=True, fresh_ns=launch_ns)
              smoke = audit / 'smoke'
              if not smoke.exists():
                  return None
              owned_path(smoke, root, directory=True, fresh_ns=launch_ns)
              ready_files = list(smoke.glob('ready-*.json'))
              if not ready_files:
                  return None
              if len(ready_files) != 1:
                  raise DiagnosticGuardError('ambiguous_ready')
              ready = ready_files[0]
              match = re.fullmatch(r'ready-([1-9][0-9]{0,9})\.json', ready.name)
              if not match:
                  raise DiagnosticGuardError('invalid_main_pid_filename')
              owned_path(ready, root, fresh_ns=launch_ns)
              if ready.stat().st_size > 1024:
                  raise DiagnosticGuardError('oversized_ready')
              try:
                  body = json.loads(ready.read_text(encoding='utf-8'))
              except (ValueError, OSError):
                  return None  # A partially written ready file can be observed before completion.
              if not isinstance(body, dict) or type(body.get('port')) is not int or not 1 <= body['port'] <= 65535:
                  raise DiagnosticGuardError('invalid_ready_body')
              desktop_log = smoke / 'logs' / 'desktop.log'
              if not desktop_log.exists():
                  return None
              owned_path(desktop_log, root, fresh_ns=launch_ns)
              if desktop_log.stat().st_size > 1024 * 1024:
                  raise DiagnosticGuardError('oversized_desktop_log')
              try:
                  text = desktop_log.read_text(encoding='utf-8', errors='replace')
              except OSError as error:
                  raise DiagnosticGuardError('desktop_log_unavailable') from error
              if not any(re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z Application ready', line) for line in text.splitlines()):
                  return None
              return {'pid': int(match[1]), 'audit': audit, 'smoke': smoke, 'ready': ready}


          class ProcBsdInfo(ctypes.Structure):
              # Darwin bsd/sys/proc_info.h: PROC_PIDTBSDINFO. Names/argv are never decoded.
              _fields_ = ([(name, ctypes.c_uint32) for name in (
                  'flags', 'status', 'exit_status', 'pid', 'ppid', 'uid', 'gid', 'ruid', 'rgid', 'saved_uid', 'saved_gid', 'reserved')]
                  + [('comm', ctypes.c_char * 16), ('name', ctypes.c_char * 32)]
                  + [(name, ctypes.c_uint32) for name in ('file_count', 'pgid', 'job_count', 'tty_device', 'tty_pgid')]
                  + [('nice', ctypes.c_int32), ('start_seconds', ctypes.c_uint64), ('start_microseconds', ctypes.c_uint64)])


          class MacProcesses:
              def __init__(self, deadline=None):
                  self.deadline = deadline
                  if platform.system() != 'Darwin' or os.geteuid() != os.getuid():
                      raise DiagnosticGuardError('unsupported_or_elevated_platform')
                  try:
                      self.lib = ctypes.CDLL('/usr/lib/libproc.dylib', use_errno=True)
                      self.lib.proc_pidpath.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
                      self.lib.proc_pidpath.restype = ctypes.c_int
                      self.lib.proc_listchildpids.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_int]
                      self.lib.proc_listchildpids.restype = ctypes.c_int
                      self.lib.proc_pidinfo.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_uint64, ctypes.c_void_p, ctypes.c_int]
                      self.lib.proc_pidinfo.restype = ctypes.c_int
                      if ctypes.sizeof(ProcBsdInfo) != 136:
                          raise DiagnosticGuardError('unexpected_native_process_structure_size')
                  except (OSError, AttributeError) as error:
                      raise DiagnosticGuardError('libproc_unavailable') from error

              def identity(self, pid):
                  if type(pid) is not int or pid <= 1:
                      raise DiagnosticGuardError('invalid_pid')
                  if self.deadline is not None and time.monotonic() >= self.deadline:
                      raise DiagnosticGuardError('original_deadline_reached_before_metadata')
                  info = ProcBsdInfo()
                  returned = self.lib.proc_pidinfo(pid, 3, 0, ctypes.byref(info), ctypes.sizeof(info))
                  if returned != ctypes.sizeof(info) or info.pid != pid or info.start_seconds == 0 or info.start_microseconds >= 1000000:
                      raise DiagnosticGuardError('invalid_or_unavailable_process_metadata')
                  buffer = ctypes.create_string_buffer(4096)
                  length = self.lib.proc_pidpath(pid, buffer, len(buffer))
                  if length <= 0 or length >= len(buffer) - 1:
                      raise DiagnosticGuardError('process_path_unavailable_or_truncated')
                  try:
                      executable = buffer.value.decode('utf-8', errors='strict')
                  except UnicodeError as error:
                      raise DiagnosticGuardError('invalid_process_path') from error
                  return {name: int(getattr(info, name)) for name in ('pid', 'ppid', 'uid', 'pgid', 'start_seconds', 'start_microseconds')} | {'executable': executable}

              def children(self, pid):
                  ids = (ctypes.c_int * 256)()
                  ctypes.set_errno(0)
                  count = self.lib.proc_listchildpids(pid, ids, ctypes.sizeof(ids))
                  if count < 0 or count >= len(ids) or (count == 0 and ctypes.get_errno() != 0):
                      raise DiagnosticGuardError('child_inventory_unavailable_or_truncated')
                  return [self.identity(ids[index]) for index in range(count) if ids[index] > 1]


          def verify_main(reader, pid, finalizer_pid, executable, uid, previous=None):
              first = reader.identity(pid)
              second = reader.identity(pid)
              if first != second or (previous is not None and first != previous):
                  raise DiagnosticGuardError('pid_identity_changed')
              if first['uid'] != uid or first['ppid'] != finalizer_pid or first['pgid'] != finalizer_pid:
                  raise DiagnosticGuardError('process_ownership_mismatch')
              if first['executable'] != str(executable):
                  raise DiagnosticGuardError('wrong_main_executable')
              return first


          def process_receipt(identity, executable, children):
              """Never save argv, environment, unknown executable paths, or other processes."""
              parent = {key: identity[key] for key in ('pid', 'ppid', 'uid', 'pgid', 'start_seconds', 'start_microseconds')}
              parent['executable'] = 'native-app/PEACE ATLAS.app/Contents/MacOS/PEACE ATLAS'
              app_root = executable.parents[2]
              saved, excluded = [], 0
              for child in children:
                  if child['ppid'] != identity['pid'] or child['uid'] != identity['uid'] or child['pgid'] != identity['pgid']:
                      excluded += 1
                      continue
                  try:
                      relative = Path(child['executable']).relative_to(app_root)
                  except ValueError:
                      excluded += 1
                      continue
                  row = {key: child[key] for key in ('pid', 'ppid', 'uid', 'pgid', 'start_seconds', 'start_microseconds')}
                  row['executable'] = 'PEACE ATLAS.app/' + str(relative)
                  saved.append(row)
              return {'main': parent, 'direct_children': saved, 'excluded_direct_children': excluded}


          def sanitize_sample(text):
              """Retain stack graph only. Discard headers, paths, Binary Images, argv, and env."""
              lines, graph, retained_frames = [], False, 0
              images = {'PEACE ATLAS', 'dyld', 'Electron Framework', 'Security', 'CoreFoundation', 'Foundation', 'AppKit', 'CoreServices',
                        'libsystem_kernel.dylib', 'libsystem_pthread.dylib', 'libsystem_c.dylib', 'libdispatch.dylib',
                        'libobjc.A.dylib', 'libsystem_platform.dylib', 'libxpc.dylib', 'libsystem_blocks.dylib',
                        'HIToolbox', 'libsystem_malloc.dylib', 'libsystem_trace.dylib', 'Python', 'python3.11'}
              public_password_symbols = {'SecKeychainFindGenericPassword', 'SecKeychainFindInternetPassword',
                                         'SecKeychainAddGenericPassword', 'SecKeychainAddInternetPassword'}
              for line in text.splitlines():
                  if line.strip() == 'Call graph:':
                      graph = True
                      lines.append('Call graph:')
                      continue
                  if not graph:
                      continue
                  if line.lstrip().startswith(('Total number in stack', 'Sort by top', 'Binary Images:')):
                      break
                  if len(line) > 1600:
                      continue
                  thread = re.match(r'^\s*(\d+)\s+Thread_(\d+)(?:\s|$)', line)
                  if thread:
                      lines.append('    ' + thread[1] + ' Thread_' + thread[2] + ' [thread label omitted]')
                      continue
                  frame = re.fullmatch(r'(\s*[+!|: ]*)(\d+)\s+(.{1,512}?)\s+\(in ([A-Za-z0-9_. -]{1,64})\)(?:\s+\+\s+(\d+))?(?:\s+\[(0x[0-9a-fA-F]+)\])?\s*', line)
                  if not frame or frame[4] not in images:
                      continue
                  symbol = frame[3]
                  if not re.fullmatch(r'[A-Za-z_$?][A-Za-z0-9_$:.<>~(), *&+\[\]-]*', symbol):
                      continue
                  if symbol not in public_password_symbols and re.search(r'token|secret|password|authorization|credential|bearer|gh[pousr]_|github_pat_|sk-', symbol, re.I):
                      symbol = '[sensitive symbol omitted]'
                  lines.append(frame[1] + frame[2] + ' ' + symbol + ' (in ' + frame[4] + ')' + (' + ' + frame[5] if frame[5] else '') + (' [' + frame[6] + ']' if frame[6] else ''))
                  retained_frames += 1
                  if sum(map(len, lines)) > 256 * 1024:
                      break
              return '\n'.join(lines) + '\n' if retained_frames else ''


          def run_native_finalizer_diagnostics(stage, evidence, native_tmp, env, timeout=1200):
              """Same finalizer command and deadline; one optional owned main-process sample."""
              if timeout != 1200:
                  raise DiagnosticGuardError('original_deadline_must_be_preserved')
              stage, evidence, native_tmp = map(Path, (stage, evidence, native_tmp))
              runner_root = evidence.parent
              for directory in (stage, evidence, native_tmp):
                  owned_path(directory, runner_root, directory=True)
              executable = stage / 'PEACE ATLAS.app/Contents/MacOS/PEACE ATLAS'
              owned_path(executable, stage)
              finalizer_script = stage / 'Finalize PEACE ATLAS.command'
              owned_path(finalizer_script, stage)
              if not executable.stat().st_mode & stat.S_IXUSR:
                  raise DiagnosticGuardError('main_executable_not_executable')
              # CI currently uses this exact allowlist, deliberately omitting every Actions credential.
              allowed_env = {'PATH', 'LANG', 'LC_ALL', 'SHELL', 'HOME', 'TMPDIR', 'PYTHONUTF8', 'PYTHONDONTWRITEBYTECODE', 'WORKBENCH_SMOKE_EXIT', 'WORKBENCH_DATA_DIR'}
              if set(env) - allowed_env or env.get('WORKBENCH_SMOKE_EXIT') != '1':
                  raise DiagnosticGuardError('unexpected_finalizer_environment')
              for name, expected in (('HOME', evidence / 'owned-home'), ('TMPDIR', native_tmp),
                                     ('WORKBENCH_DATA_DIR', evidence / 'finalizer-post-open-profile')):
                  if Path(env.get(name, '')).resolve() != expected.resolve():
                      raise DiagnosticGuardError('unexpected_finalizer_owned_profile')
                  owned_path(expected, evidence, directory=True)
