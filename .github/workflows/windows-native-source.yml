              summary.write('Isolated Windows native acceptance passed for full commit ' + os.environ['SOURCE_SHA'] + '.\n\n')
              summary.write('ZIP SHA-256: ' + result['sha256'] + '. Desktop/SQLite backup/fonts/read-only budget preview/private browser passed. No real model, external collection or formal profile was used. This unsigned candidate is a new runner-built archive.\n')
          '@ | python -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload only accepted assets to the same existing private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pa-win'
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          if repo != os.environ['EXPECTED_REPOSITORY'] or not re.fullmatch(r'[a-f0-9]{40}', os.environ['SOURCE_SHA']):
              raise SystemExit('Repository or source input changed')
          if not re.fullmatch(r'v[0-9][A-Za-z0-9._-]{0,126}', tag) or '..' in tag:
              raise SystemExit('Invalid release tag')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', '--hostname', 'github.com', path], timeout=120))
          accepted = json.loads((root / 'evidence/acceptance.json').read_text(encoding='utf-8'))
          if accepted.get('ok') is not True or accepted['source_sha'] != os.environ['SOURCE_SHA'] or accepted['release_tag'] != tag or accepted['source_manifest_sha256'] != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('Complete same-input native acceptance is required before upload')
          release = api('repos/' + repo + '/releases/' + str(accepted['draft_release_id']))
          if api('repos/' + repo).get('private') is not True or release.get('draft') is not True or release['id'] != accepted['draft_release_id'] or release.get('tag_name') != tag:
              raise SystemExit('The same private draft must still exist')
          tag_reference = api('repos/' + repo + '/git/ref/tags/' + tag)
          tag_commit = tag_reference.get('object')
          if tag_reference.get('ref') != 'refs/tags/' + tag or not isinstance(tag_commit, dict) or tag_commit.get('type') != 'commit' or tag_commit.get('sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('The existing fixed release tag must point directly to the exact correction source commit')
          archive = pathlib.Path(os.environ['RAW_ARCHIVE']).resolve(strict=True)
          source_dist = (pathlib.Path(os.environ['SOURCE_DIR']) / 'dist').resolve(strict=True)
          if not archive.is_relative_to(source_dist) or hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() != accepted['native_accepted_archive_sha256']:
              raise SystemExit('The exact native-tested ZIP changed before upload')
          asset_name = accepted['native_accepted_archive']
          if asset_name != os.environ['UPLOAD_ARCHIVE_NAME'] or not re.fullmatch(r'PEACE-ATLAS-2\.0\.0-windows-x64-foundation-quality-20261011-native-[a-f0-9]{12}-run[0-9]+-[0-9]+\.zip', asset_name):
              raise SystemExit('Unexpected candidate asset name')
          assets = root / 'release-assets'
          sidecars = [assets / (asset_name + '.sha256'), assets / (asset_name + '.acceptance.json')]
          if {path.name for path in assets.iterdir()} != {path.name for path in sidecars}:
              raise SystemExit('Only acceptance/hash sidecars may accompany the audited ZIP')
          wanted_names = {asset_name, *(path.name for path in sidecars)}
          if wanted_names & {asset['name'] for asset in release['assets']}:
              raise SystemExit('Candidate asset already exists; replacement is forbidden')
          # A hard link gives gh a unique filename without copying/recompressing 400 MB.
          # Both paths remain in the same owned runner volume and reference the tested ZIP.
          upload_archive = assets / asset_name
          os.link(archive, upload_archive)
          all_assets = [upload_archive, *sidecars]
          # No --clobber. gh uses its authenticated release-list fallback for this private draft.
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, all_assets), '--repo', repo], check=True, timeout=1200)
          after = api('repos/' + repo + '/releases/' + str(accepted['draft_release_id']))
          if after.get('draft') is not True or after['id'] != accepted['draft_release_id'] or after.get('tag_name') != tag:
              raise SystemExit('Private draft identity changed during upload')
          uploaded = {asset['name']: asset for asset in after['assets']}
          records = []
          for path in all_assets:
              asset = uploaded.get(path.name)
              expected_sha = accepted['native_accepted_archive_sha256'] if path == upload_archive else hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              if not asset or asset.get('state') != 'uploaded' or asset.get('size') != path.stat().st_size or asset.get('digest') != 'sha256:' + expected_sha:
                  raise SystemExit('GitHub server size/state/SHA-256 digest differs from accepted asset: ' + path.name)
              records.append({'id': asset['id'], 'name': path.name, 'sha256': expected_sha, 'bytes': path.stat().st_size, 'server_digest_verified': True})
          (root / 'evidence/upload-receipt.json').write_text(json.dumps({'ok': True, 'repository': repo, 'release_tag': tag,
              'release_id': after['id'], 'draft': True, 'source_sha': accepted['source_sha'],
              'source_manifest_sha256': accepted['source_manifest_sha256'], 'assets': records}, indent=2), encoding='utf-8')
          print('Accepted ZIP/hash/acceptance uploaded without replacement; all server SHA-256 digests verified')
          '@ | python -X utf8 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve small owned native evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pa-win/evidence/*.json
            ${{ runner.temp }}/pa-win/evidence/*.log
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/desktop-smoke*.json
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/desktop-smoke.png
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/desktop-eva-*.png
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/desktop-budget-*.png
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/desktop-backup-controls.png
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/logs/desktop.log
            ${{ runner.temp }}/pa-win/evidence/isolated-profile/logs/backend.log
            ${{ runner.temp }}/pa-win/release-assets/*.sha256
            ${{ runner.temp }}/pa-win/release-assets/*.acceptance.json
